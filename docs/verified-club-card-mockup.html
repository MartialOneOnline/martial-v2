<title>Verified Club Card — Roger Gracie Malaga</title>
<style>
  :root{
    --page-bg:#eef2f7;
    --page-fg:#0E3A7A;
    --card-navy:#0E3A7A;
    --card-navy-deep:#0a2b5c;
    --brand-blue:#0870E2;
    --brand-cyan:#7DE7EC;
    --gold:#F5B429;
    --gold-deep:#B9791A;
    --paper:#ffffff;
    --muted-text:#6b7a94;
    --hairline:rgba(14,58,122,0.10);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --page-bg:#0b1220;
      --page-fg:#dbe6f7;
      --hairline:rgba(255,255,255,0.08);
    }
  }
  :root[data-theme="dark"]{
    --page-bg:#0b1220;
    --page-fg:#dbe6f7;
    --hairline:rgba(255,255,255,0.08);
  }
  :root[data-theme="light"]{
    --page-bg:#eef2f7;
    --page-fg:#0E3A7A;
    --hairline:rgba(14,58,122,0.10);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--page-bg);
    color:var(--page-fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
    padding:40px 16px 56px;
    min-height:100vh;
  }

  .stage-label{
    font-size:11px;
    font-weight:700;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--muted-text);
    text-align:center;
  }

  .card{
    position:relative;
    width:340px;
    max-width:100%;
    aspect-ratio:9/13.5;
    border-radius:28px;
    overflow:hidden;
    background:
      radial-gradient(120% 90% at 30% 0%, rgba(255,255,255,0.10), rgba(255,255,255,0) 55%),
      linear-gradient(180deg, #123a7a 0%, #0a2453 62%, #071938 100%);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.15) inset,
      0 30px 60px -20px rgba(4,16,40,0.55),
      0 8px 20px -8px rgba(4,16,40,0.35);
    display:flex;
    flex-direction:column;
    color:#fff;
  }

  /* photo zone */
  .photo{
    position:relative;
    flex:1 1 auto;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .badge{
    position:absolute;
    top:16px;

    align-items:center;
    gap:6px;
    padding:7px 12px 7px 9px;
    border-radius:999px;
    background:linear-gradient(135deg, #4CBB86, #2E9E68);

  .link-btn{
    position:absolute;
    top:16px;
    right:16px;
    width:34px;
    height:34px;
    border-radius:50%;
    background:rgba(255,255,255,0.14);
    border:1px solid rgba(255,255,255,0.28);
    backdrop-filter:blur(6px);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .link-btn svg{width:15px;height:15px;color:#fff;}

  /* identity strip, overlapping */
  .identity{
    position:relative;
    margin:-30px 14px 0;
    background:var(--paper);
    color:var(--card-navy);
    border-radius:18px;
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:10px;
    box-shadow:0 14px 30px -14px rgba(4,16,40,0.45);
    z-index:2;
  }
  .id-icon{
    flex:none;
    width:38px;height:38px;
    border-radius:50%;
    background:#fff;
    border:1px solid var(--hairline);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    box-shadow:0 1px 4px rgba(14,58,122,0.12);
  }
  .id-icon img{width:100%;height:100%;object-fit:cover;}
  .id-text{flex:1;min-width:0;}
  .id-name{
    font-size:14.5px;
    font-weight:600;
    letter-spacing:-0.005em;
    line-height:1.2;
    white-space:nowrap;
  }
  .id-loc{
    margin-top:2px;
    font-size:11.5px;
    font-weight:500;
    color:var(--muted-text);
    display:flex;
    align-items:center;
    gap:4px;
  }
  .id-loc svg{width:11px;height:11px;flex:none;}
  .rating{
    flex:none;
    display:flex;
    align-items:center;
    gap:4px;
    padding:5px 9px;
    border-radius:999px;
    background:#FFF4DE;
    color:var(--gold-deep);
    font-size:12.5px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  .rating svg{width:13px;height:13px;fill:var(--gold);}

  /* stats */
  .stats{
    margin:14px 14px 16px;
    border-radius:18px;
    padding:14px;
    background:linear-gradient(160deg, #0f7bf0, #0a58c4);
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    box-shadow:0 1px 0 rgba(255,255,255,0.25) inset;
  }
  .stat{
    background:rgba(255,255,255,0.13);
    border:1px solid rgba(255,255,255,0.16);
    border-radius:13px;
    padding:10px 12px;
    display:flex;
    flex-direction:column;
    gap:7px;
  }
  .stat-head{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .stat-head svg{width:13px;height:13px;color:rgba(255,255,255,0.85);flex:none;}
  .stat-label{
    font-size:9.5px;
    font-weight:700;
    letter-spacing:0.09em;
    text-transform:uppercase;
    color:rgba(255,255,255,0.72);
  }
  .stat-value{
    font-size:19px;
    font-weight:800;
    letter-spacing:-0.01em;
    font-variant-numeric:tabular-nums;
    color:#fff;
  }

  .swap-note{
    max-width:340px;
    text-align:center;
    font-size:12px;
    line-height:1.5;
    color:var(--muted-text);
  }
  .swap-note b{color:var(--page-fg);}
